<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Auto de F1 visto desde arriba, apuntando hacia arriba -->
  <g fill="#1a1a1a">
    <!-- neumáticos traseros -->
    <rect x="4" y="41" width="11" height="17" rx="3"/>
    <rect x="49" y="41" width="11" height="17" rx="3"/>
    <!-- neumáticos delanteros -->
    <rect x="7" y="10" width="10" height="14" rx="3"/>
    <rect x="47" y="10" width="10" height="14" rx="3"/>
  </g>
  <g fill="#e5212b">
    <!-- alerón delantero -->
    <rect x="5" y="3" width="54" height="5" rx="2"/>
    <!-- trompa, cockpit y pontones -->
    <path d="M29 1 h6 l2 7 l1 14 h8 l5 6 v20 l-4 4 v6 h-30 v-6 l-4 -4 v-20 l5 -6 h8 l1 -14 z"/>
    <!-- ejes -->
    <rect x="16" y="15" width="32" height="3"/>
    <rect x="14" y="47" width="36" height="3"/>
    <!-- alerón trasero -->
    <rect x="13" y="58" width="38" height="5" rx="2"/>
  </g>
  <!-- halo y cockpit -->
  <path d="M28 26 a4 4 0 0 1 8 0 v9 h-8 z" fill="#1a1a1a"/>
  <!-- toma de aire y lomo -->
  <rect x="30" y="38" width="4" height="12" rx="1.5" fill="#8a0f16"/>
</svg>
